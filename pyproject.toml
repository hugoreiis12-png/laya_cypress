[project]
name = "evalkit"
version = "0.1.0"
description = "Gold set and per-field evaluation harness for the document extraction pipeline"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["evalkit", "evalkit.engines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
